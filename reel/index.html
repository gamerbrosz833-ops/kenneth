<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <title>Signal over noise · Kenneth Rosales</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@400;500&family=JetBrains+Mono:wght@400;500&display=swap"
    />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      :root {
        --ink: #0c0c0b;
        --line: #2a2926;
        --mute: #8c887f;
        --paper: #ece8df;
        --gold: #c9a46a;
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1920px; height: 1080px; overflow: hidden; background: var(--ink); }
      #root { position: relative; width: 1920px; height: 1080px; overflow: hidden; background: var(--ink); }
      #field { position: absolute; inset: 0; }
      .mono {
        position: absolute;
        font-family: "JetBrains Mono", ui-monospace, monospace;
        font-size: 20px;
        letter-spacing: 0.18em;
        text-transform: uppercase;
        color: var(--mute);
      }
      .mono b { color: var(--paper); font-weight: 500; }
      .chapter { left: 120px; top: 104px; }
      .chapter span { position: absolute; left: 0; top: 0; white-space: nowrap; }
      .facts { right: 120px; top: 104px; text-align: right; }
      .facts span { position: absolute; right: 0; top: 0; white-space: nowrap; }
      .lane-label { left: 120px; font-size: 16px; }
      .corner { left: 120px; bottom: 96px; font-size: 16px; }
      .corner-r { right: 120px; bottom: 96px; font-size: 16px; }
      #headline {
        position: absolute;
        left: 0; right: 0; top: 300px;
        text-align: center;
        font-family: "Instrument Serif", Georgia, serif;
        font-weight: 400;
        font-size: 150px;
        line-height: 1;
        letter-spacing: -0.02em;
        color: var(--paper);
      }
      #headline .w { display: inline-block; }
      #headline em { font-style: italic; color: var(--gold); }
      #name {
        position: absolute;
        left: 0; right: 0; top: 330px;
        text-align: center;
        font-family: "Instrument Serif", Georgia, serif;
        font-size: 176px;
        line-height: 1;
        letter-spacing: -0.025em;
        color: var(--paper);
      }
      #role {
        position: absolute;
        left: 0; right: 0; top: 640px;
        text-align: center;
        font-family: "JetBrains Mono", ui-monospace, monospace;
        font-size: 22px;
        letter-spacing: 0.24em;
        text-transform: uppercase;
        color: var(--mute);
      }
      #role i { color: var(--gold); font-style: normal; }
      #veil { position: absolute; inset: 0; background: var(--ink); }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="12" data-width="1920" data-height="1080">
      <div id="stage" class="clip" data-start="0" data-duration="12" data-track-index="0" style="position:absolute;inset:0">
        <svg id="field" viewBox="0 0 1920 1080" width="1920" height="1080">
          <g id="lanes">
            <line class="lane" x1="360" y1="420" x2="1560" y2="420" stroke="#2a2926" stroke-width="1" />
            <line class="lane" x1="360" y1="540" x2="1560" y2="540" stroke="#2a2926" stroke-width="1" />
            <line class="lane" x1="360" y1="660" x2="1560" y2="660" stroke="#2a2926" stroke-width="1" />
          </g>
          <g id="dots"></g>
          <line id="signal" x1="160" y1="720" x2="160" y2="720" stroke="#c9a46a" stroke-width="2" />
          <circle id="spark" cx="160" cy="720" r="6" fill="#c9a46a" opacity="0" />
        </svg>

        <div class="mono chapter">
          <span id="ch1">01 — Noise</span>
          <span id="ch2">02 — System</span>
          <span id="ch3">03 — Signal</span>
        </div>
        <div class="mono facts">
          <span id="f1"><b>~200</b> cases / month</span>
          <span id="f2"><b>~20</b> investigators · <b>2</b> continents</span>
          <span id="f3">Human review, <b>always</b></span>
        </div>
        <div class="mono lane-label" id="l1" style="top:406px">Intake</div>
        <div class="mono lane-label" id="l2" style="top:526px">Review</div>
        <div class="mono lane-label" id="l3" style="top:646px">Resolve</div>

        <h1 id="headline">
          <span class="w">Operations,</span> <span class="w">made</span> <span class="w"><em>legible.</em></span>
        </h1>
        <div id="name">Kenneth Rosales</div>
        <div id="role">Operations <i>·</i> Program Management <i>·</i> AI-enabled workflows</div>

        <div class="mono corner" id="cnr">Managua — Remote</div>
        <div class="mono corner-r" id="cnr2">Portfolio · 2026</div>
        <div id="veil"></div>
      </div>
      <audio id="score" src="assets/score.wav" data-start="0" data-duration="12" data-track-index="2" data-volume="1"></audio>
    </div>

    <script>
      (function () {
        const W = 1920, H = 1080, N = 180, PER = 60;
        // seeded PRNG: identical in preview and render
        let seed = 20210521;
        const rand = () => ((seed = (seed * 1664525 + 1013904223) >>> 0) / 4294967296);

        const NS = "http://www.w3.org/2000/svg";
        const g = document.getElementById("dots");
        const dots = [];
        for (let i = 0; i < N; i++) {
          const c = document.createElementNS(NS, "circle");
          const lane = i % 3, k = Math.floor(i / 3);
          const p = {
            el: c, k,
            x0: 140 + rand() * (W - 280), y0: 180 + rand() * (H - 360),
            dx: (rand() - 0.5) * 90, dy: (rand() - 0.5) * 60,
            x1: 360 + k * (1200 / (PER - 1)), y1: 420 + lane * 120,
            x2: 160 + (i / (N - 1)) * 1600, y2: 720,
            r: 2.4 + rand() * 2.2,
          };
          c.setAttribute("cx", p.x0.toFixed(1));
          c.setAttribute("cy", p.y0.toFixed(1));
          c.setAttribute("r", p.r.toFixed(2));
          c.setAttribute("fill", "#ece8df");
          c.setAttribute("opacity", "0");
          g.appendChild(c);
          dots.push(p);
        }

        const tl = gsap.timeline({ paused: true });
        const T1 = 3.4, T2 = 6.0, T3 = 7.6, T4 = 9.9;

        // ---------- 01 Noise ----------
        tl.fromTo("#veil", { autoAlpha: 1 }, { autoAlpha: 0, duration: 0.8, ease: "power2.out" }, 0);
        dots.forEach((p, i) => {
          const d = (i * 0.0083) % 1.4;
          tl.fromTo(p.el, { attr: { opacity: 0 } }, { attr: { opacity: 0.25 + (i % 5) * 0.12 }, duration: 0.6, ease: "power1.out", immediateRender: false }, 0.2 + d);
          tl.fromTo(p.el, { attr: { cx: p.x0, cy: p.y0 } },
            { attr: { cx: p.x0 + p.dx, cy: p.y0 + p.dy }, duration: T1 - 0.2, ease: "sine.inOut", immediateRender: false }, 0.2);
        });
        tl.fromTo("#ch1", { autoAlpha: 0, y: 10 }, { autoAlpha: 1, y: 0, duration: 0.6, ease: "power2.out" }, 0.5);
        tl.fromTo("#f1", { autoAlpha: 0, y: 10 }, { autoAlpha: 1, y: 0, duration: 0.6, ease: "power2.out" }, 0.9);
        tl.fromTo("#cnr, #cnr2", { autoAlpha: 0 }, { autoAlpha: 1, duration: 0.8 }, 0.9);
        tl.to("#ch1, #f1", { autoAlpha: 0, y: -10, duration: 0.4, ease: "power2.in" }, T1 - 0.3);

        // ---------- 02 System ----------
        tl.fromTo(".lane", { attr: { x2: 360 } }, { attr: { x2: 1560 }, duration: 1.1, ease: "power3.inOut", stagger: 0.12 }, T1 - 0.2);
        dots.forEach((p) => {
          tl.to(p.el, { attr: { cx: p.x1, cy: p.y1, r: 3.2, opacity: 0.9 }, duration: 1.2, ease: "expo.inOut" }, T1 + (p.k % 60) * 0.006);
        });
        tl.fromTo("#l1, #l2, #l3", { autoAlpha: 0, x: -12 }, { autoAlpha: 1, x: 0, duration: 0.5, stagger: 0.1, ease: "power2.out" }, T1 + 0.7);
        tl.fromTo("#ch2", { autoAlpha: 0, y: 10 }, { autoAlpha: 1, y: 0, duration: 0.5, ease: "power2.out" }, T1 + 0.2);
        tl.fromTo("#f2", { autoAlpha: 0, y: 10 }, { autoAlpha: 1, y: 0, duration: 0.5, ease: "power2.out" }, T1 + 0.4);
        // a pulse runs down each lane: work moving through the system
        dots.forEach((p) => {
          tl.fromTo(p.el, { attr: { fill: "#ece8df" } }, { attr: { fill: "#c9a46a" }, duration: 0.14, ease: "none", immediateRender: false }, T1 + 1.35 + p.k * 0.016);
          tl.fromTo(p.el, { attr: { fill: "#c9a46a" } }, { attr: { fill: "#ece8df" }, duration: 0.3, ease: "power1.out", immediateRender: false }, T1 + 1.49 + p.k * 0.016);
        });
        tl.to("#ch2, #f2, #l1, #l2, #l3", { autoAlpha: 0, duration: 0.4, ease: "power2.in" }, T2 - 0.3);
        tl.to(".lane", { attr: { "stroke-opacity": 0 }, duration: 0.5 }, T2 - 0.2);

        // ---------- 03 Signal ----------
        dots.forEach((p, i) => {
          tl.to(p.el, { attr: { cx: p.x2, cy: p.y2, r: 1.6 }, duration: 1.1, ease: "power3.inOut" }, T2 + (i % 60) * 0.004);
        });
        tl.fromTo("#ch3", { autoAlpha: 0, y: 10 }, { autoAlpha: 1, y: 0, duration: 0.5, ease: "power2.out" }, T2 + 0.2);
        tl.fromTo("#f3", { autoAlpha: 0, y: 10 }, { autoAlpha: 1, y: 0, duration: 0.5, ease: "power2.out" }, T2 + 0.4);
        tl.fromTo("#signal", { attr: { x2: 160 } }, { attr: { x2: 1760 }, duration: 1.3, ease: "expo.inOut" }, T3 - 0.4);
        tl.fromTo("#spark", { attr: { cx: 160, opacity: 0 } }, { attr: { cx: 1760, opacity: 1 }, duration: 1.3, ease: "expo.inOut" }, T3 - 0.4);
        tl.to("#dots circle", { attr: { opacity: 0 }, duration: 0.6, ease: "power1.in" }, T3 + 0.3);
        tl.fromTo("#headline .w", { autoAlpha: 0, y: 40 },
          { autoAlpha: 1, y: 0, duration: 0.9, ease: "expo.out", stagger: 0.16 }, T3);

        // ---------- Name ----------
        tl.to("#headline", { autoAlpha: 0, y: -20, duration: 0.5, ease: "power2.in" }, T4 - 0.5);
        tl.to("#ch3, #f3", { autoAlpha: 0, duration: 0.4 }, T4 - 0.5);
        tl.to("#signal", { attr: { x1: 800, x2: 1120, y1: 590, y2: 590 }, duration: 0.9, ease: "power3.inOut" }, T4 - 0.4);
        tl.to("#spark", { attr: { cx: 1120, cy: 590, opacity: 0 }, duration: 0.6 }, T4 - 0.4);
        tl.fromTo("#name", { autoAlpha: 0, y: 30 }, { autoAlpha: 1, y: 0, duration: 1.2, ease: "expo.out" }, T4);
        tl.fromTo("#role", { autoAlpha: 0, y: 12 }, { autoAlpha: 1, y: 0, duration: 0.8, ease: "power2.out" }, T4 + 0.4);

        // back to ink for a clean loop
        tl.to("#veil", { autoAlpha: 1, duration: 0.5, ease: "power2.in" }, 11.45);

        window.__timelines["main"] = tl;
        tl.seek(0);
      })();
    </script>
  </body>
</html>
